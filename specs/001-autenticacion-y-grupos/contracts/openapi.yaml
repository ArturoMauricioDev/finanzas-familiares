# API Contracts: Autenticación, Registro y Gestión de Grupos Familiares

Base path: `/api/v1`  
Auth: Bearer JWT (propio) excepto `POST /auth/google` y `POST /auth/refresh`.

## Auth

### POST /auth/google

Intercambia un Google ID token por un JWT propio.

**Request**
```json
{
  "id_token": "string"
}
```

**Response 200**
```json
{
  "access_token": "string",
  "refresh_token": "string",
  "token_type": "bearer",
  "user": {
    "id": "uuid",
    "email": "string",
    "nombre_visualizacion": "string|null",
    "foto_avatar": "string|null",
    "family_id": "uuid|null",
    "role": "admin|member|null"
  },
  "needs_profile_setup": true,
  "needs_family_setup": true
}
```

**Validation / security**: el backend DEBE verificar firma, audiencia, emisor y expiración del
token con `google-auth`. No existe fallback de decodificación sin verificar.

**Errors**: `401` si el Google token es inválido, expirado, de otra audiencia o no verificable.

### POST /auth/refresh

Renueva tokens y devuelve el estado actual de onboarding.

**Request**
```json
{
  "refresh_token": "string"
}
```

**Response 200**: mismo formato que `/auth/google`, con tokens nuevos y claims actualizados.

**Errors**: `401` si el refresh token es inválido, expirado o de tipo incorrecto.

## Users / Profile

### PUT /users/me/profile

Configura el perfil inicial (obligatorio si `needs_profile_setup=true`).

**Auth**: required

**Request**
```json
{
  "nombre_visualizacion": "string",
  "foto_avatar": "string"
}
```

**Response 200**
```json
{
  "id": "uuid",
  "nombre_visualizacion": "string",
  "foto_avatar": "string",
  "family_id": "uuid|null",
  "role": "admin|member|null"
}
```

**Errors**: `401` no autenticado; `422` si `nombre_visualizacion` o `foto_avatar` están vacíos.

## Families

### POST /families

Crea un grupo familiar (sólo si el usuario no tiene membresía activa).

**Auth**: required (sin membresía activa)

**Request**
```json
{
  "nombre": "string",
  "moneda_local": "string",
  "rol_familiar": "padre|madre"
}
```

**Response 201**
```json
{
  "family": {
    "id": "uuid",
    "nombre": "string",
    "moneda_local": "string",
    "creado_por": "uuid",
    "fecha_creacion": "datetime"
  },
  "membership": {
    "role": "admin",
    "rol_familiar": "padre|madre",
    "estado": "activo"
  },
  "tokens": {
    "access_token": "string",
    "refresh_token": "string",
    "token_type": "bearer"
  }
}
```

**Behavior**: `Family` y `Membership(admin)` con `rol_familiar` Padre/Madre se crean en una sola
transacción. Los tokens devueltos incluyen `family_id` y `role`.

**Errors**: `400` si ya pertenece a un grupo activo; `401` no autenticado; `422` si `nombre` está
vacío, `moneda_local` no es un código ISO 4217 de 3 letras o `rol_familiar` no es Padre/Madre al
crear.

### GET /families/me

Obtiene el grupo y sus miembros activos.

**Auth**: required + pertenece a grupo

**Response 200**
```json
{
  "family": {
    "id": "uuid",
    "nombre": "string",
    "moneda_local": "string",
    "creado_por": "uuid",
    "fecha_creacion": "datetime"
  },
  "members": [
    {
      "user_id": "uuid",
      "nombre_visualizacion": "string",
      "foto_avatar": "string",
      "role": "admin|member",
      "rol_familiar": "padre|madre|hijo|hija|null",
      "rol_permiso": "admin|member",
      "parentesco": "string|null",
      "estado": "activo"
    }
  ],
  "member_count": 5
}
```

**Errors**: `401` no autenticado; `403` si el usuario no pertenece a un grupo (redirigir a setup).

## Invitations

### POST /families/me/invitations

Genera un código de invitación (sólo admin).

**Auth**: required + role admin + pertenece a grupo

**Request**: sin cuerpo; la expiración es fija de 7 días. El campo heredado `expira_en_horas` se
acepta por compatibilidad pero no modifica la expiración.

**Response 201**
```json
{
  "invitation_id": "uuid",
  "codigo": "string",
  "expira_en": "datetime",
  "usado": false
}
```

**Behavior**: código alfanumérico único de 8 caracteres, de un solo uso y con expiración fija de 7
días. La UI expone únicamente el código, no un enlace.

**Errors**: `401` no autenticado; `403` si no es admin.

### POST /invitations/join

Une al usuario autenticado a un grupo mediante un código de invitación.

**Auth**: required + sin membresía activa

**Request**
```json
{
  "codigo": "string",
  "rol_familiar": "padre|madre|hijo|hija|null",
  "parentesco": "string|null"
}
```

**Response 200**
```json
{
  "family_id": "uuid",
  "role": "admin|member",
  "estado": "activo",
  "tokens": {
    "access_token": "string",
    "refresh_token": "string",
    "token_type": "bearer"
  }
}
```

**Behavior**: valida código, expiración y uso; cuenta miembros activos; crea `Membership` con
`role=admin` cuando `rol_familiar` es Padre/Madre (o cuando el `parentesco` lo indica) y `member` en
el resto; marca `usado=true` en una sola transacción. Los tokens devueltos incluyen `family_id` y el
`role` resultante.

**Errors**: `400` si el código es inválido, expirado o ya usado; `400` si el grupo alcanzó 10
miembros activos; `400` si el usuario ya pertenece a un grupo; `401` no autenticado; `422` si
`rol_familiar` no es un valor permitido.

## Members Management (Admin)

### POST /families/me/members/:user_id/promote

Promueve un miembro a admin (sólo admin).

**Auth**: required + role admin

**Response 200**
```json
{
  "success": true
}
```

**Errors**: `401` no autenticado; `403` si no es admin; `404` si el miembro no pertenece al grupo o
está inactivo.

### DELETE /families/me/members/:user_id

Expulsa o da de baja a un miembro (sólo admin). Marca la membresía como `inactivo`.

**Auth**: required + role admin

**Response 200**
```json
{ "success": true }
```

**Errors**: `400` si el admin intenta expulsarse a sí mismo o si dejaría al grupo sin
administradores; `401` no autenticado; `403` si no es admin; `404` si el miembro no pertenece al
grupo o está inactivo.

## Error Codes

- `400 Bad Request`: límite de 10 alcanzado, segundo grupo, código inválido/expirado/usado,
  auto-expulsión o último admin.
- `401 Unauthorized`: JWT propio ausente/inválido o Google token inválido.
- `403 Forbidden`: sin permisos (no admin) o sin grupo donde se requiere.
- `404 Not Found`: miembro inexistente o inactivo.
- `409 Conflict`: conflictos de unicidad (email/google_id) según corresponda.
- `422 Unprocessable Entity`: validación de payload (moneda, perfil, rol familiar, campos vacíos).

## Cross-Cutting Notes

- Todos los errores DEBEN tener cuerpo `{"detail": "..."}` y la UI DEBE traducirlos a mensajes
  claros.
- CORS DEBE usar una lista de orígenes permitidos (no `*` con credenciales).
- Las URLs base de API y Client IDs de Google se configuran por entorno. `INVITATION_LINK_BASE` es
  heredada y no se usa: la UI solo muestra códigos.
